site_name: Proyecto de Ingeniería
theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: purple
    accent: deep purple

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - footnotes
  - attr_list
  - def_list
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - Prácticas:
    - Práctica 1: Practicas/Practica1.md
    - Clase 2: Practicas/Clase2.md